services:
  postgres-db:
    image: postgres:18
    container_name: postgresql
    environment:
      POSTGRES_DB: management
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: testtest
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: fin_management_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    environment:
      - SPRING_PROFILES_ACTIVE=test

      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/management
      - SPRING_DATASOURCE_USERNAME=useruser
      - SPRING_DATASOURCE_PASSWORD=testest
      - JWT_SECRET=YourSuperLongAndSecureSecretKeyForJWTTokenGeneration2026
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-mock-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-mock-client-secret}

volumes:
  pg_data: